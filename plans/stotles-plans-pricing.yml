summary: >-
  Stotles publishes list prices for three product lines — Sales Studio, Bid Studio and the combined
  B2G Growth Engine — across Free / Basic / Growth / Expert tiers. Prices are "from" figures with
  Expert always custom. CRITICALLY FOR THIS PIPELINE: no tier on this page mentions API access, an
  API quota, or the MCP server. The Stotles Public API is not a purchasable line item; it is
  obtained through a Customer Success Manager, and MCP access is waitlisted.

api_access:
  attached_to_any_published_tier: false
  self_serve: false
  detail: >-
    The word "API" does not appear in any tier's feature list. The closest entries are "Integration
    support" (Sales Studio Expert), "Custom integrations — Custom pricing" (Sales Studio compare
    table) and "Custom integration support" (B2G Growth Engine Expert). The API's own documentation
    says keys are "issued by Stotles — ask your Customer Success Manager", and the integrations page
    offers a "Book a call" CTA for the API and a "Join the waitlist" CTA for MCP.
  implication: >-
    An agent developer cannot price, buy, or provision Stotles API access without a sales
    conversation. The programmable surface exists and is well-built, but it sits entirely behind a
    commercial gate.

data_quality_note: >-
  The pricing page contradicts itself on two tiers, in the same page load on 2026-08-14. Recorded as
  observed rather than reconciled:
  (1) Sales Studio Basic is "From £75 / month" in the tier card, "From £50 / month" in the
      Compare-plans table, and "from £99 / month" in the B2G-tab rendering of the same tier.
  (2) Bid Studio Growth is "from £990 / month" in the tier card and Compare-plans table, and
      "from £495 / month" in the B2G-tab rendering.
  Treat the higher figure as the safer planning number and confirm with sales.

