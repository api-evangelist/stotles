actions:
  - target: $.info
    description: Attach API Evangelist provenance and cross-links to the derived artifact set.
    update:
      x-apievangelist:
        profile: https://apis.io/provider/stotles
        harvested: '2026-08-14'
        harvested_from: https://api.stotles.com/v1/openapi.json
