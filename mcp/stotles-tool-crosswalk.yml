source: >-
  Binds the Stotles MCP server (probed live at https://api.stotles.com/mcp, tools/list gated behind
  x-api-key) to the operations in openapi/stotles-public-api-openapi.yml (harvested verbatim from
  https://api.stotles.com/v1/openapi.json, HTTP 200, 2026-08-14).

surfaces:
  openapi:
    file: openapi/stotles-public-api-openapi.yml
    original: openapi/_original/stotles-public-api-openapi.json
    served_at: https://api.stotles.com/v1/openapi.json
    http_status: 200
    gated: false
    note: >-
      The spec document itself is served anonymously; the operations it describes are not.
      Every call needs `x-api-key`, so an unauthenticated agent gets 401 problem+json.
  mcp:
    url: https://api.stotles.com/mcp
    transport: streamable-http
    gated: true
    note: >-
      POST tools/list returns JSON-RPC error -32001 "Unauthorized: Missing API key" (HTTP 401).
      The real tool names and inputSchemas are NOT observable anonymously.
  graphql:
    present: false
    note: api.stotles.com/graphql returns 404. No public GraphQL surface.

confidence_basis: >-
  Because the live tool list is gated and Stotles publishes no MCP tool reference, every row below
  is mapped by SEMANTICS, not by an observed tool name. Confidence is capped at `medium` for the
  whole crosswalk: the REST operations are certain, the tool names are inferred. The `inputSchema`
  column is real regardless — whatever the tools are named, an MCP tool fronting `searchNotices`
  inherits that operation's 23 query parameters.

