openapi: 3.2.0
info:
  title: Stotles Public Notices API
  description: 'The Stotles Public API gives you programmatic access to UK public sector procurement

    data — notices, buyers, suppliers and framework agreements — as JSON over HTTPS.'
  version: '1.0'
  contact:
    name: Stotles API Support
    url: https://www.stotles.com
servers:
- url: https://api.stotles.com
  description: Production
security:
- apiKey: []
tags:
- name: Notices
  description: Public sector procurement notices.
paths:
  /v1/notices/search:
    get:
      description: Search and filter procurement notices. Every parameter is optional, so filters can stand alone without a keyword. Results are ranked by relevance unless `sort` is set, and paginated with `next_cursor`.
      operationId: searchNotices
      parameters:
      - name: query
        required: false
        in: query
        description: Free-text keyword search over the notice (each 2–500 characters). Repeatable; multiple values are combined per `query_operator`.
        schema:
          maxItems: 50
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 500
        style: form
        explode: true
      - name: query_operator
        required: false
        in: query
        description: 'How multiple `query` keywords combine: match all (`and`) or any (`or`). Default `or`.'
        schema:
          default: or
          type: string
          enum:
          - and
          - or
      - name: country_code
        required: false
        in: query
        description: Filter to notices in these ISO 3166-1 alpha-2 countries. Repeatable.
        schema:
          maxItems: 100
          type: array
          items:
            type: string
            pattern: ^[A-Za-z]{2}$
        style: form
        explode: true
      - name: cpv_code
        required: false
        in: query
        description: Filter to notices classified under these CPV codes. Repeatable.
        schema:
          maxItems: 100
          type: array
          items:
            type: string
            minLength: 1
        style: form
        explode: true
      - name: buyer_id
        required: false
        in: query
        description: Filter to notices involving these buyers (by id). Repeatable.
        schema:
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - name: supplier_id
        required: false
        in: query
        description: Filter to notices awarded to these suppliers (by id). Repeatable.
        schema:
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - name: stage
        required: false
        in: query
        description: Filter to notices in these stages. Repeatable.
        schema:
          maxItems: 10
          type: array
          items:
            type: string
            enum:
            - pipeline
            - pre_tender
            - stale_pre_tender
            - open_tender
            - closed_tender
            - canceled_tender
            - unknown_tender
            - awarded_contract
            - expired_contract
            - canceled_award
            description: The notice's procurement stage.
            x-enumDescriptions:
              pipeline: An early signal that a procurement is coming — spotted in a buyer's forward plan or contract pipeline, before any formal notice. No tender documents exist yet.
              pre_tender: The buyer has published a formal early-market notice (e.g. a planning or prior-information notice). The tender is not open yet.
              stale_pre_tender: A pre-tender notice that has aged well past the point where a tender would normally have followed. Treat it as unlikely to progress.
              open_tender: Accepting bids — the submission deadline (`close_date`) has not passed.
              closed_tender: The submission deadline has passed and the buyer has not published an award yet.
              canceled_tender: The buyer withdrew or abandoned the procurement before awarding it.
              unknown_tender: A tender notice whose deadline could not be determined from the source, so we can't say whether it is still open.
              awarded_contract: A contract has been awarded. See `contracts` for the suppliers and awarded values.
              expired_contract: The awarded contract has passed the end of its known term. Note that this is derived from the contract record, so an `expired_contract` can still carry a **future** `expiry_date` — don't infer timing from the stage.
              canceled_award: An award that was later cancelled or annulled.
        style: form
        explode: true
      - name: framework_id
        required: false
        in: query
        description: Filter to notices related to these frameworks (by id) — a framework agreement or a call-off against it. Repeatable.
        schema:
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - name: framework_activity
        required: false
        in: query
        description: Narrow by framework relationship (agreement vs call-off).
        schema:
          type: string
          enum:
          - only_framework_agreements
          - only_call_offs
          - exclude_framework_agreements
          - exclude_all
          x-enumDescriptions:
            only_framework_agreements: Only notices that establish a framework agreement, excluding the call-offs made under one.
            only_call_offs: Only notices that are call-offs (individual awards) under an existing framework.
            exclude_framework_agreements: Everything except the notices that establish a framework — keeps call-offs and non-framework procurements.
            exclude_all: Only procurements unrelated to any framework.
      - name: publish_date_gte
        required: false
        in: query
        description: Only notices published on or after this date (inclusive).
        schema:
          format: date
          type: string
      - name: publish_date_lte
        required: false
        in: query
        description: Only notices published on or before this date (inclusive).
        schema:
          format: date
          type: string
      - name: close_date_gte
        required: false
        in: query
        description: Only notices whose tender close date is on or after this date (inclusive).
        schema:
          format: date
          type: string
      - name: close_date_lte
        required: false
        in: query
        description: Only notices whose tender close date is on or before this date (inclusive).
        schema:
          format: date
          type: string
      - name: expiry_date_gte
        required: false
        in: query
        description: Only notices whose contract expiry date is on or after this date (inclusive).
        schema:
          format: date
          type: string
      - name: expiry_date_lte
        required: false
        in: query
        description: Only notices whose contract expiry date is on or before this date (inclusive).
        schema:
          format: date
          type: string
      - name: award_date_gte
        required: false
        in: query
        description: Only notices whose award date is on or after this date (inclusive).
        schema:
          format: date
          type: string
      - name: award_date_lte
        required: false
        in: query
        description: Only notices whose award date is on or before this date (inclusive).
        schema:
          format: date
          type: string
      - name: value_gte
        required: false
        in: query
        description: Only notices whose estimated value is greater than or equal to this amount, in the notice's own currency (values are not currency-normalized). Excludes notices with no value.
        schema:
          minimum: 1
          type: number
      - name: value_lte
        required: false
        in: query
        description: Only notices whose estimated value is less than or equal to this amount, in the notice's own currency (values are not currency-normalized). Excludes notices with no value.
        schema:
          minimum: 1
          type: number
      - name: sort
        required: false
        in: query
        description: Sort field. Omitted = relevance ranking. For date sorts (close/award/expiry, often null), notices missing that date sort last in both directions.
        schema:
          type: string
          enum:
          - publish_date
          - close_date
          - award_date
          - expiry_date
          - value
      - name: order
        required: false
        in: query
        description: Sort direction (default desc). Applies when `sort` is set.
        schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
      - name: limit
        required: false
        in: query
        description: Maximum results per page (1–50, default 20). Ignored when `cursor` is set.
        schema:
          minimum: 1
          maximum: 50
          default: 20
          type: integer
      - name: cursor
        required: false
        in: query
        description: Opaque pagination cursor from a previous response's `next_cursor`. Carries the page and page size, so `limit` is ignored when it is present.
        schema:
          type: string
      responses:
        '200':
          description: A page of matching notices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeSearchResponseDto'
              example:
                items:
                - id: 8f14e45f-ea0d-4a3b-9c2e-1d7b6a5c4e30
                  title: Managed Cyber Security Operations Centre (SOC) Services
                  description: The Authority is seeking a supplier to deliver a managed Security Operations Centre, including 24/7 monitoring, threat intelligence and incident response, for an initial term of three years with an optional two-year extension.
                  country_code: GB
                  stage: open_tender
                  source_url: https://www.find-tender.service.gov.uk/Notice/012345-2026
                  publish_date: '2026-07-14'
                  close_date: '2026-08-29'
                  award_date: null
                  expiry_date: null
                  value:
                    amount: 4500000
                    currency: GBP
                  buyers:
                  - id: 3c6e0b8a-9c15-4f2d-8b7a-2e5d1c9f4a60
                    name: Department for Work and Pensions
                  cpv_codes:
                  - code: '72500000'
                    name: Computer-related services
                  - code: '79710000'
                    name: Security services
                  framework: null
                  lots:
                  - id: '1'
                    title: Lot 1 — Monitoring and detection
                    description: 24/7 SOC monitoring, alert triage and detection engineering.
                    value:
                      amount: 3000000
                      currency: GBP
                    cpv_codes:
                    - code: '72500000'
                      name: Computer-related services
                    contract_period:
                      start_date: '2026-11-01'
                      end_date: '2029-10-31'
                      max_extent_date: '2031-10-31'
                  - id: '2'
                    title: Lot 2 — Incident response retainer
                    description: On-call incident response and forensic investigation.
                    value:
                      amount: 1500000
                      currency: GBP
                    cpv_codes:
                    - code: '79710000'
                      name: Security services
                    contract_period:
                      start_date: '2026-11-01'
                      end_date: '2029-10-31'
                      max_extent_date: null
                  contracts: []
                next_cursor: eyJwYWdlIjoyLCJsaW1pdCI6MjB9
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Search notices by keyword
      tags:
      - Notices
      x-codeSamples:
      - lang: cURL
        label: curl
        source: "curl -G https://api.stotles.com/v1/notices/search \\\n  -H \"x-api-key: $STOTLES_API_KEY\" \\\n  --data-urlencode \"query=cyber security\" \\\n  -d \"stage=open_tender\" \\\n  -d \"country_code=GB\" \\\n  -d \"limit=20\""
  /v1/notices/{id}:
    get:
      description: Fetch a single notice, including its lots and any awarded contracts. The `id` is the same identifier returned by notice search and by the `buyer_id`/`supplier_id` filters.
      operationId: getNotice
      parameters:
      - name: id
        required: true
        in: path
        description: The notice's unique identifier.
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: The notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeResponseDto'
              example:
                id: 8f14e45f-ea0d-4a3b-9c2e-1d7b6a5c4e30
                title: Managed Cyber Security Operations Centre (SOC) Services
                description: The Authority is seeking a supplier to deliver a managed Security Operations Centre, including 24/7 monitoring, threat intelligence and incident response, for an initial term of three years with an optional two-year extension.
                country_code: GB
                stage: open_tender
                source_url: https://www.find-tender.service.gov.uk/Notice/012345-2026
                publish_date: '2026-07-14'
                close_date: '2026-08-29'
                award_date: null
                expiry_date: null
                value:
                  amount: 4500000
                  currency: GBP
                buyers:
                - id: 3c6e0b8a-9c15-4f2d-8b7a-2e5d1c9f4a60
                  name: Department for Work and Pensions
                cpv_codes:
                - code: '72500000'
                  name: Computer-related services
                - code: '79710000'
                  name: Security services
                framework: null
                lots:
                - id: '1'
                  title: Lot 1 — Monitoring and detection
                  description: 24/7 SOC monitoring, alert triage and detection engineering.
                  value:
                    amount: 3000000
                    currency: GBP
                  cpv_codes:
                  - code: '72500000'
                    name: Computer-related services
                  contract_period:
                    start_date: '2026-11-01'
                    end_date: '2029-10-31'
                    max_extent_date: '2031-10-31'
                - id: '2'
                  title: Lot 2 — Incident response retainer
                  description: On-call incident response and forensic investigation.
                  value:
                    amount: 1500000
                    currency: GBP
                  cpv_codes:
                  - code: '79710000'
                    name: Security services
                  contract_period:
                    start_date: '2026-11-01'
                    end_date: '2029-10-31'
                    max_extent_date: null
                contracts: []
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Get a notice by id
      tags:
      - Notices
      x-codeSamples:
      - lang: cURL
        label: curl
        source: "curl https://api.stotles.com/v1/notices/8f14e45f-ea0d-4a3b-9c2e-1d7b6a5c4e30 \\\n  -H \"x-api-key: $STOTLES_API_KEY\""
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: Stable category identifier — clients branch on this.
          format: uri
        title:
          type: string
          description: Short, human-readable summary of the category. Stable per `type`.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code, duplicated in the body so the payload is self-contained.
        detail:
          description: Human-readable, occurrence-specific detail. Omitted on 5xx so we never leak internals.
          type: string
        errors:
          description: Per-field validation failures; present only on validation (400) problems.
          type: array
          items:
            anyOf:
            - type: object
              properties:
                detail:
                  type: string
                  description: Human-readable description of this field error.
                pointer:
                  type: string
              required:
              - detail
              - pointer
              additionalProperties: false
            - type: object
              properties:
                detail:
                  type: string
                  description: Human-readable description of this field error.
                parameter:
                  type: string
              required:
              - detail
              - parameter
              additionalProperties: false
            - type: object
              properties:
                detail:
                  type: string
                  description: Human-readable description of this field error.
                header:
                  type: string
              required:
              - detail
              - header
              additionalProperties: false
      required:
      - type
      - title
      - status
      additionalProperties: true
    NoticeSearchResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: The notice's unique identifier.
              title:
                type: string
                description: The notice's title.
              description:
                type: string
                description: The notice's description.
              country_code:
                type: string
                description: ISO 3166-1 alpha-2 country code the notice relates to.
              stage:
                type: string
                enum:
                - pipeline
                - pre_tender
                - stale_pre_tender
                - open_tender
                - closed_tender
                - canceled_tender
                - unknown_tender
                - awarded_contract
                - expired_contract
                - canceled_award
                description: The notice's procurement stage.
                x-enumDescriptions:
                  pipeline: An early signal that a procurement is coming — spotted in a buyer's forward plan or contract pipeline, before any formal notice. No tender documents exist yet.
                  pre_tender: The buyer has published a formal early-market notice (e.g. a planning or prior-information notice). The tender is not open yet.
                  stale_pre_tender: A pre-tender notice that has aged well past the point where a tender would normally have followed. Treat it as unlikely to progress.
                  open_tender: Accepting bids — the submission deadline (`close_date`) has not passed.
                  closed_tender: The submission deadline has passed and the buyer has not published an award yet.
                  canceled_tender: The buyer withdrew or abandoned the procurement before awarding it.
                  unknown_tender: A tender notice whose deadline could not be determined from the source, so we can't say whether it is still open.
                  awarded_contract: A contract has been awarded. See `contracts` for the suppliers and awarded values.
                  expired_contract: The awarded contract has passed the end of its known term. Note that this is derived from the contract record, so an `expired_contract` can still carry a **future** `expiry_date` — don't infer timing from the stage.
                  canceled_award: An award that was later cancelled or annulled.
              source_url:
                type: string
                description: URL of the notice on the original source.
              publish_date:
                type: string
                format: date
                description: Date this notice was published (its phase's release date).
              close_date:
                type:
                - string
                - 'null'
                format: date
                description: Bid submission deadline (tender close). Indicative on pre-tender notices; null on award/contract notices (the deadline is on the sibling tender notice).
              award_date:
                type:
                - string
                - 'null'
                format: date
                description: Date the contract was awarded. Best-effort (may fall back to contract start); earliest across awards. Null before award.
              expiry_date:
                type:
                - string
                - 'null'
                format: date
                description: Earliest expected contract end date. Excludes extensions/options, so it is the earliest — not latest — end. Null when not applicable or unknown.
              value:
                type:
                - object
                - 'null'
                properties:
                  amount:
                    type: number
                    description: The amount as a JSON number, byte-aligned with the upstream feed. Parse with a big-decimal library — do not rely on IEEE-754 float arithmetic.
                  currency:
                    type:
                    - string
                    - 'null'
                    description: ISO 4217 currency code (e.g. GBP). Null when the source didn't specify one.
                required:
                - amount
                - currency
                description: Estimated total value of the notice; null when no amount is known.
              buyers:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The buyer's unique identifier.
                    name:
                      type: string
                      description: The buyer's name.
                  required:
                  - id
                  - name
                description: Buyers associated with the notice.
              cpv_codes:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: The CPV code.
                    name:
                      type: string
                      description: Human-readable label for the CPV code.
                  required:
                  - code
                  - name
                description: CPV classification codes for the notice.
              framework:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The related framework's unique identifier.
                  relationship:
                    type: string
                    enum:
                    - framework_agreement
                    - call_off
                    description: 'How this notice relates to the framework: `framework_agreement` = it establishes the framework; `call_off` = it is a call-off under it.'
                    x-enumDescriptions:
                      framework_agreement: This notice establishes the framework.
                      call_off: This notice is a call-off (an individual award) made under the framework.
                required:
                - id
                - relationship
                description: The framework this notice relates to; null when it is unrelated to any framework.
              lots:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The lot's identifier within the notice.
                    title:
                      type: string
                      description: The lot's title.
                    description:
                      type: string
                      description: The lot's description.
                    value:
                      type:
                      - object
                      - 'null'
                      properties:
                        amount:
                          type: number
                          description: The amount as a JSON number, byte-aligned with the upstream feed. Parse with a big-decimal library — do not rely on IEEE-754 float arithmetic.
                        currency:
                          type:
                          - string
                          - 'null'
                          description: ISO 4217 currency code (e.g. GBP). Null when the source didn't specify one.
                      required:
                      - amount
                      - currency
                      description: Estimated value of the lot; null when no amount is known.
                    cpv_codes:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            description: The CPV code.
                          name:
                            type: string
                            description: Human-readable label for the CPV code.
                        required:
                        - code
                        - name
                      description: CPV classification codes for the lot.
                    contract_period:
                      type: object
                      properties:
                        start_date:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Start of the contract period. Null when unknown.
                        end_date:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Earliest expected end of the contract period. Null when unknown.
                        max_extent_date:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Latest date the period can be extended to (excl. is the earliest end). Null when unknown.
                      required:
                      - start_date
                      - end_date
                      - max_extent_date
                      description: The lot's contract period.
                  required:
                  - id
                  - title
                  - description
                  - value
                  - cpv_codes
                  - contract_period
                description: Lots the notice is divided into.
              contracts:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                      description: The contract's title.
                    description:
                      type: string
                      description: The contract's description.
                    value:
                      type:
                      - object
                      - 'null'
                      properties:
                        amount:
                          type: number
                          description: The amount as a JSON number, byte-aligned with the upstream feed. Parse with a big-decimal library — do not rely on IEEE-754 float arithmetic.
                        currency:
                          type:
                          - string
                          - 'null'
                          description: ISO 4217 currency code (e.g. GBP). Null when the source didn't specify one.
                      required:
                      - amount
                      - currency
                      description: Awarded value of the contract; null when no amount is known.
                    award_date:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Date the contract was awarded. Null when unknown.
                    contract_period:
                      type: object
                      properties:
                        start_date:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Start of the contract period. Null when unknown.
                        end_date:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Earliest expected end of the contract period. Null when unknown.
                        max_extent_date:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Latest date the period can be extended to (excl. is the earliest end). Null when unknown.
                      required:
                      - start_date
                      - end_date
                      - max_extent_date
                      description: The contract's period.
                    cpv_codes:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            description: The CPV code.
                          name:
                            type: string
                            description: Human-readable label for the CPV code.
                        required:
                        - code
                        - name
                      description: CPV classification codes for the contract.
                    suppliers:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The supplier's unique identifier.
                          name:
                            type: string
                            description: The supplier's name.
                        required:
                        - id
                        - name
                      description: Suppliers awarded the contract (by id).
                    lots:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The lot's identifier within the notice.
                          title:
                            type: string
                            description: The lot's title.
                        required:
                        - id
                        - title
                      description: Lots covered by the contract.
                  required:
                  - title
                  - description
                  - value
                  - award_date
                  - contract_period
                  - cpv_codes
                  - suppliers
                  - lots
                description: Contracts/awards made under the notice.
            required:
            - id
            - title
            - description
            - country_code
            - stage
            - source_url
            - publish_date
            - close_date
            - award_date
            - expiry_date
            - value
            - buyers
            - cpv_codes
            - framework
            - lots
            - contracts
          description: The matching notices, most relevant first.
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page of results; null when this is the last page.
      required:
      - items
      - next_cursor
    NoticeResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The notice's unique identifier.
        title:
          type: string
          description: The notice's title.
        description:
          type: string
          description: The notice's description.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code the notice relates to.
        stage:
          type: string
          enum:
          - pipeline
          - pre_tender
          - stale_pre_tender
          - open_tender
          - closed_tender
          - canceled_tender
          - unknown_tender
          - awarded_contract
          - expired_contract
          - canceled_award
          description: The notice's procurement stage.
          x-enumDescriptions:
            pipeline: An early signal that a procurement is coming — spotted in a buyer's forward plan or contract pipeline, before any formal notice. No tender documents exist yet.
            pre_tender: The buyer has published a formal early-market notice (e.g. a planning or prior-information notice). The tender is not open yet.
            stale_pre_tender: A pre-tender notice that has aged well past the point where a tender would normally have followed. Treat it as unlikely to progress.
            open_tender: Accepting bids — the submission deadline (`close_date`) has not passed.
            closed_tender: The submission deadline has passed and the buyer has not published an award yet.
            canceled_tender: The buyer withdrew or abandoned the procurement before awarding it.
            unknown_tender: A tender notice whose deadline could not be determined from the source, so we can't say whether it is still open.
            awarded_contract: A contract has been awarded. See `contracts` for the suppliers and awarded values.
            expired_contract: The awarded contract has passed the end of its known term. Note that this is derived from the contract record, so an `expired_contract` can still carry a **future** `expiry_date` — don't infer timing from the stage.
            canceled_award: An award that was later cancelled or annulled.
        source_url:
          type: string
          description: URL of the notice on the original source.
        publish_date:
          type: string
          format: date
          description: Date this notice was published (its phase's release date).
        close_date:
          type:
          - string
          - 'null'
          format: date
          description: Bid submission deadline (tender close). Indicative on pre-tender notices; null on award/contract notices (the deadline is on the sibling tender notice).
        award_date:
          type:
          - string
          - 'null'
          format: date
          description: Date the contract was awarded. Best-effort (may fall back to contract start); earliest across awards. Null before award.
        expiry_date:
          type:
          - string
          - 'null'
          format: date
          description: Earliest expected contract end date. Excludes extensions/options, so it is the earliest — not latest — end. Null when not applicable or unknown.
        value:
          type:
          - object
          - 'null'
          properties:
            amount:
              type: number
              description: The amount as a JSON number, byte-aligned with the upstream feed. Parse with a big-decimal library — do not rely on IEEE-754 float arithmetic.
            currency:
              type:
              - string
              - 'null'
              description: ISO 4217 currency code (e.g. GBP). Null when the source didn't specify one.
          required:
          - amount
          - currency
          description: Estimated total value of the notice; null when no amount is known.
        buyers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: The buyer's unique identifier.
              name:
                type: string
                description: The buyer's name.
            required:
            - id
            - name
          description: Buyers associated with the notice.
        cpv_codes:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The CPV code.
              name:
                type: string
                description: Human-readable label for the CPV code.
            required:
            - code
            - name
          description: CPV classification codes for the notice.
        framework:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
              description: The related framework's unique identifier.
            relationship:
              type: string
              enum:
              - framework_agreement
              - call_off
              description: 'How this notice relates to the framework: `framework_agreement` = it establishes the framework; `call_off` = it is a call-off under it.'
              x-enumDescriptions:
                framework_agreement: This notice establishes the framework.
                call_off: This notice is a call-off (an individual award) made under the framework.
          required:
          - id
          - relationship
          description: The framework this notice relates to; null when it is unrelated to any framework.
        lots:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The lot's identifier within the notice.
              title:
                type: string
                description: The lot's title.
              description:
                type: string
                description: The lot's description.
              value:
                type:
                - object
                - 'null'
                properties:
                  amount:
                    type: number
                    description: The amount as a JSON number, byte-aligned with the upstream feed. Parse with a big-decimal library — do not rely on IEEE-754 float arithmetic.
                  currency:
                    type:
                    - string
                    - 'null'
                    description: ISO 4217 currency code (e.g. GBP). Null when the source didn't specify one.
                required:
                - amount
                - currency
                description: Estimated value of the lot; null when no amount is known.
              cpv_codes:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: The CPV code.
                    name:
                      type: string
                      description: Human-readable label for the CPV code.
                  required:
                  - code
                  - name
                description: CPV classification codes for the lot.
              contract_period:
                type: object
                properties:
                  start_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Start of the contract period. Null when unknown.
                  end_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Earliest expected end of the contract period. Null when unknown.
                  max_extent_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Latest date the period can be extended to (excl. is the earliest end). Null when unknown.
                required:
                - start_date
                - end_date
                - max_extent_date
                description: The lot's contract period.
            required:
            - id
            - title
            - description
            - value
            - cpv_codes
            - contract_period
          description: Lots the notice is divided into.
        contracts:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: The contract's title.
              description:
                type: string
                description: The contract's description.
              value:
                type:
                - object
                - 'null'
                properties:
                  amount:
                    type: number
                    description: The amount as a JSON number, byte-aligned with the upstream feed. Parse with a big-decimal library — do not rely on IEEE-754 float arithmetic.
                  currency:
                    type:
                    - string
                    - 'null'
                    description: ISO 4217 currency code (e.g. GBP). Null when the source didn't specify one.
                required:
                - amount
                - currency
                description: Awarded value of the contract; null when no amount is known.
              award_date:
                type:
                - string
                - 'null'
                format: date
                description: Date the contract was awarded. Null when unknown.
              contract_period:
                type: object
                properties:
                  start_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Start of the contract period. Null when unknown.
                  end_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Earliest expected end of the contract period. Null when unknown.
                  max_extent_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Latest date the period can be extended to (excl. is the earliest end). Null when unknown.
                required:
                - start_date
                - end_date
                - max_extent_date
                description: The contract's period.
              cpv_codes:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: The CPV code.
                    name:
                      type: string
                      description: Human-readable label for the CPV code.
                  required:
                  - code
                  - name
                description: CPV classification codes for the contract.
              suppliers:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: The supplier's unique identifier.
                    name:
                      type: string
                      description: The supplier's name.
                  required:
                  - id
                  - name
                description: Suppliers awarded the contract (by id).
              lots:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The lot's identifier within the notice.
                    title:
                      type: string
                      description: The lot's title.
                  required:
                  - id
                  - title
                description: Lots covered by the contract.
            required:
            - title
            - description
            - value
            - award_date
            - contract_period
            - cpv_codes
            - suppliers
            - lots
          description: Contracts/awards made under the notice.
      required:
      - id
      - title
      - description
      - country_code
      - stage
      - source_url
      - publish_date
      - close_date
      - award_date
      - expiry_date
      - value
      - buyers
      - cpv_codes
      - framework
      - lots
      - contracts
  responses:
    InternalError:
      description: An unexpected error occurred.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.stotles.com/problems/internal
            title: Internal server error
            status: 500
    RateLimited:
      description: The client has sent too many requests in a given amount of time.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.stotles.com/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Rate limit exceeded. Retry later.
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.stotles.com/problems/not-found
            title: Not found
            status: 404
            detail: No notice exists with the given id.
    ValidationError:
      description: The request failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.stotles.com/problems/validation
            title: Request validation failed
            status: 400
            detail: The request parameters failed validation. See the 'errors' array for details.
            errors:
            - parameter: id
              detail: Invalid uuid
    Unauthenticated:
      description: Missing or invalid API key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.stotles.com/problems/unauthenticated
            title: Unauthenticated
            status: 401
            detail: Missing or invalid API key.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
