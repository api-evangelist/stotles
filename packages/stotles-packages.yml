integration_alternatives:
  note: >-
    In place of an SDK, Stotles' documented integration paths are: raw HTTPS calls to
    https://api.stotles.com/v1 with an `x-api-key` header; the hosted MCP server at
    https://api.stotles.com/mcp (beta, waitlist); and native product connectors for Salesforce,
    HubSpot, Slack, Microsoft Teams, SharePoint and Google Drive configured inside the app rather
    than by a developer.
  postman_collection:
    published: false
    note: No public Postman workspace or collection was found for Stotles.
  openapi_generation_viable: true
  openapi_generation_note: >-
    The published OpenAPI 3.1.0 is complete enough (typed parameters, enums with descriptions,
    response schemas, RFC 9457 error components) that a consumer can generate a perfectly usable
    client with openapi-generator or Hey API. The absence of an official SDK is therefore a low-cost
    gap for consumers — but it is still a real zero.

