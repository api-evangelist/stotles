method: searched
source: >-
  Registry sweeps of npm (registry.npmjs.org search + per-package metadata), PyPI, RubyGems,
  crates.io, NuGet, Maven Central and pkg.go.dev, plus the github.com/Stotles organization listing
  via the GitHub API, run 2026-08-14.

summary:
  first_party_sdk_count: 0
  first_party_package_count: 2
  third_party_package_count: 0
  note: >-
    Stotles publishes NO client library for the Stotles Public API in any registry, in any language.
    The two packages below ARE first-party (published under the `@stotles` npm scope from the
    company's own GitHub organization) but they are internal engineering libraries Stotles has
    open-sourced — a NestJS/GraphQL utility and a Better Auth plugin — not API clients. They cannot
    be used to call api.stotles.com.
  sdk_pointer_policy: >-
    NO `SDKs` pointer is emitted in apis.yml. The sdk_count check must read a genuine zero here.
    Emitting SDKs on the strength of two unrelated first-party libraries would credit Stotles with
    a client-library practice it does not have. `Packages` is emitted, because the packages are real.

official_api_clients: []

first_party_packages:
  - language: typescript
    registry: npm
    name: '@stotles/nestjs-graphql-zod'
    url: https://www.npmjs.com/package/@stotles/nestjs-graphql-zod
    install: npm install @stotles/nestjs-graphql-zod
    official: true
    api_client: false
    version: 4.1.3
    published: '2026-06-23'
    license: MPL-2.0
    repository: https://github.com/Stotles/nestjs-graphql-zod
    description: >-
      "A library providing dynamic GraphQL object classes from their zod validation objects."
      A general-purpose NestJS/GraphQL developer utility, not a Stotles API client. A fork/maintained
      continuation of an upstream community package, republished under the Stotles scope.
    source: https://registry.npmjs.org/@stotles/nestjs-graphql-zod
    note: >-
      Actively maintained — last release 2026-06-23, repo pushed 2026-08-02. Incidentally reveals
      Stotles' internal stack (NestJS + GraphQL + Zod), which is consistent with the
      zod-flavoured validation messages in the public API's 400 responses
      ("Too big: expected number to be <=50").

  - language: typescript
    registry: npm
    name: '@stotles/better-auth-audit-logs'
    url: https://www.npmjs.com/package/@stotles/better-auth-audit-logs
    install: npm install @stotles/better-auth-audit-logs
    official: true
    api_client: false
    version: 0.5.1
    published: '2026-07-15'
    license: MIT
    repository: https://github.com/Stotles/better-auth-audit-logs
    description: >-
      "Audit log plugin for Better Auth. Auto-captures auth events with severity inference, PII
      redaction, custom storage backends, and retention policies." An authentication-infrastructure
      plugin Stotles open-sourced; not a Stotles API client.
    source: https://registry.npmjs.org/@stotles/better-auth-audit-logs
    note: >-
      Most recently maintained Stotles open-source artifact — released 2026-07-15, repo pushed
      2026-08-11.

