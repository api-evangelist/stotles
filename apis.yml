apis:
- name: Stotles Public API
  description: >-
    REST API giving programmatic access to UK and Ireland public sector procurement data — notices,
    buyers, suppliers and framework agreements — as JSON over HTTPS. Eight read-only operations
    across four resources, each with a cursor-paginated /search and a by-UUID lookup. Notices carry
    the full procurement lifecycle (forward-plan pipeline through open tender to awarded and expired
    contract) with lots, contracts, awarded suppliers, CPV classification codes and estimated
    values. Filterable by keyword, CPV code, buyer, supplier, framework, stage, value band and four
    independent date ranges. Authenticated with a static x-api-key header issued by a Stotles
    Customer Success Manager. RFC 9457 problem+json errors, opaque-cursor pagination, and a
    published additive-only versioning contract.
  humanURL: https://www.stotles.com/integrations
