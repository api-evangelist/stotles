aid: stotles
name: Stotles
description: >-
  Stotles is a B2G (business-to-government) public sector procurement and sales
  intelligence platform for the UK and Ireland. It aggregates procurement
  notices, contract awards, framework agreements, buyer spend history, and
  verified decision-maker contacts from public sources such as Find a Tender,
  Contracts Finder, Digital Marketplace, TED, and Public Contracts Scotland,
  then layers tender discovery, market intelligence, AI-assisted bid
  qualification (Bid Studio), account targeting (Sales Studio), and pipeline
  management on top so suppliers can find, qualify, and win government
  contracts. Delivered as a SaaS web application at app.stotles.com, and — since
  2026 — as a programmable surface: the Stotles Public API is a documented
  OpenAPI 3.1.0 REST service at api.stotles.com/v1 covering notices, buyers,
  suppliers and framework agreements, alongside a hosted Model Context Protocol
  server at api.stotles.com/mcp that brings the same market data into AI chat
  tools and agents. Both authenticate with a static x-api-key header; keys are
  issued by a Customer Success Manager rather than self-serve, and MCP access is
  in beta behind a waitlist.
