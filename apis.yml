- name: Stotles MCP Server
  description: >-
    Hosted, remote Model Context Protocol server exposing Stotles public sector market data to AI
    chat tools and agents. Streamable-HTTP transport at api.stotles.com/mcp, authenticated with the
    same x-api-key header as the REST API. Described by Stotles as letting teams "explore the market
    in natural language and pull the insights they need without leaving their tools". In beta behind
    a public waitlist; tools/list is auth-gated, so the live tool schemas require an issued key.
  humanURL: https://www.stotles.com/integrations
  baseURL: https://api.stotles.com/mcp
